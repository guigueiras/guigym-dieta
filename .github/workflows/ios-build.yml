name: iOS Build

on:
  workflow_dispatch:

jobs:
  verify-project:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        continue-on-error: true
        run: npx expo-doctor

      - name: Generate iOS project
        run: npx expo prebuild --platform ios