name: iOS Build

on:
  workflow_dispatch:

jobs:
  verify-project:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Generate iOS project
        run: npx expo prebuild --platform ios

      - name: Show Podfile Properties
        run: |
          cat ios/Podfile.properties.json

      - name: Debug Environment
        run: |
          printenv | grep RCT
          printenv | grep EXPO

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Verify Pods
        run: |
          ls -la ios
          ls -la ios/Pods